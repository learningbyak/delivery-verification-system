name: Keep parser service awake

# Render's free tier spins down a web service after 15 minutes with no
# inbound traffic, then takes 30-60 seconds to wake back up on the
# next request (see docs/phases/phase-2.md's timeout-fix notes). This
# workflow pings the service's /health endpoint just often enough to
# prevent it from ever going to sleep during active hours — free,
# using GitHub Actions' own free scheduled-workflow minutes.
#
# Honest limitation: GitHub Actions' free-tier scheduled workflows can
# run a few minutes late under load, and this only helps while it's
# actually running on schedule. It substantially reduces how often a
# real user hits a cold start — it does not guarantee zero cold
# starts. The upload route's own timeout/retry messaging (see the
# route file) is the backstop for whenever a cold start still happens.
#
# Required: set PARSER_SERVICE_URL as a repository secret (Settings →
# Secrets and variables → Actions → New repository secret) to your
# Render service's URL, e.g. https://your-service.onrender.com

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {} # allows manually triggering a run to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping parser service health endpoint
        run: |
          curl -sf "${{ secrets.PARSER_SERVICE_URL }}/health" || echo "Ping failed — service may be mid-wake-up, this is not necessarily a problem"
