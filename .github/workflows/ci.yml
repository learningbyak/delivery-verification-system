name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: RLS enforcement check
        run: npm run check:rls

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  parser-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run parser tests
        run: pytest -v

  # Placeholder — SAST wired in properly once there's real business logic
  # to scan (Phase 6, per the security assessment's production gate).
  # Left as a visible, intentional gap rather than silently absent.
  sast:
    runs-on: ubuntu-latest
    steps:
      - run: echo "SAST scanning intentionally deferred to Phase 6 — see docs/phases/phase-0.md"
